[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerlens-ai"
version = "0.1.0"
description = "Deterministic payment incident reconstruction and sandbox recovery"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.2", "pydantic==2.11.5", "sqlalchemy==2.0.41", "networkx==3.4.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "hypothesis==6.131.9", "ruff==0.11.11"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]
